name: Release

on:
  workflow_run:
    workflows: ["CI", "Mailcow integration"]
    types: [completed]

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: stable-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Derive and validate release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              version = str(tomllib.load(handle)["project"]["version"])

          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit(f"Unsupported release version: {version}")

          init_text = Path("moolias/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if match is None or match.group(1) != version:
              raise SystemExit("pyproject.toml and moolias.__version__ do not match")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if re.search(rf"^## {re.escape(version)} - .+$", changelog, re.MULTILINE) is None:
              raise SystemExit(f"CHANGELOG.md has no released section for {version}")

          print(version)
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify stable release gates
        id: gates
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          CURRENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" \
            > /tmp/moolias-release-runs.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("CI", "Mailcow integration")
          data = json.loads(Path("/tmp/moolias-release-runs.json").read_text(encoding="utf-8"))
          latest = {}

          for run in data.get("workflow_runs", []):
              name = str(run.get("name") or "")
              if name not in required or run.get("head_branch") != "main":
                  continue
              previous = latest.get(name)
              if previous is None or int(run.get("run_number") or 0) > int(previous.get("run_number") or 0):
                  latest[name] = run

          current_name = os.environ.get("CURRENT_WORKFLOW", "")
          if current_name in required:
              latest.setdefault(
                  current_name,
                  {
                      "name": current_name,
                      "status": "completed",
                      "conclusion": os.environ.get("CURRENT_CONCLUSION", ""),
                      "run_number": 0,
                  },
              )

          ready = True
          for name in required:
              run = latest.get(name)
              if run is None:
                  print(f"Release gate {name}: no push run for this commit yet")
                  ready = False
                  continue
              status = str(run.get("status") or "")
              conclusion = str(run.get("conclusion") or "")
              print(f"Release gate {name}: {status} / {conclusion or 'pending'}")
              if status != "completed" or conclusion != "success":
                  ready = False

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"ready={'true' if ready else 'false'}\n")
          PY

      - uses: actions/setup-python@v7
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Generate release service icons
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install simple-icons-pack==16.28.0
          python -m moolias.service_icon_assets

      - name: Extract changelog section
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## {re.escape(version)} - .+$", text, re.MULTILINE)
          if heading is None:
              raise SystemExit(f"Missing changelog section for {version}")

          start = heading.end()
          next_heading = re.search(r"^## ", text[start:], re.MULTILINE)
          end = start + next_heading.start() if next_heading is not None else len(text)
          notes = text[start:end].strip()
          if not notes:
              raise SystemExit(f"Empty changelog section for {version}")

          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - uses: docker/setup-buildx-action@v4
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'

      - uses: docker/login-action@v4
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable container image
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/moolias:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/moolias:${{ steps.meta.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/moolias:${{ steps.meta.outputs.major }}
            ghcr.io/${{ github.repository_owner }}/moolias:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release and tag
        if: steps.release_state.outputs.exists != 'true' && steps.gates.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Moolias $TAG" \
            --notes-file release-notes.md
