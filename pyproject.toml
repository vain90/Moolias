[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moolias"
version = "0.2.0"
description = "Self-hosted privacy alias manager for mailcow"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Moolias contributors" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "tldextract>=5.3,<6",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["moolias*"]

[tool.setuptools.package-data]
moolias = ["templates/*.html", "static/*", "wordlists/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"moolias/main.py" = ["B008"]
"moolias/ui.py" = ["E731", "F401"]
