name: Mailcow integration

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "moolias/__init__.py"
      - "integration_tests/**"
      - "moolias/mailcow.py"
      - "moolias/aliases.py"
      - "moolias/stats_mode.py"
      - "moolias/config.py"
      - "moolias/mailcow_agent.py"
      - "moolias/newsletter_agent.py"
      - "moolias/newsletter_forwarding.py"
      - "moolias/newsletter_mode.py"
      - "moolias/newsletter_preferences.py"
      - "moolias/newsletter_store.py"
      - "moolias/newsletters.py"
      - "moolias/sender_protocol.py"
      - "moolias/sender_protection.py"
      - "moolias/static/sender-protection.js"
      - "moolias/static/newsletter-settings.js"
      - "install.sh"
      - "install-newsletter.sh"
      - "scripts/install.sh"
      - "scripts/install-mailcow-agent.sh"
      - "scripts/install-newsletter-agent.sh"
      - "scripts/install-newsletter-rspamd.sh"
      - "scripts/rspamd/moolias_newsletter.lua"
      - "compose.mailcow.yml"
      - "Dockerfile"
      - ".github/scripts/mailcow-feasibility.sh"
      - ".github/workflows/mailcow-integration.yml"
  pull_request:
    paths:
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "moolias/__init__.py"
      - "integration_tests/**"
      - "moolias/mailcow.py"
      - "moolias/aliases.py"
      - "moolias/stats_mode.py"
      - "moolias/config.py"
      - "moolias/mailcow_agent.py"
      - "moolias/newsletter_agent.py"
      - "moolias/newsletter_forwarding.py"
      - "moolias/newsletter_mode.py"
      - "moolias/newsletter_preferences.py"
      - "moolias/newsletter_store.py"
      - "moolias/newsletters.py"
      - "moolias/sender_protocol.py"
      - "moolias/sender_protection.py"
      - "moolias/static/sender-protection.js"
      - "moolias/static/newsletter-settings.js"
      - "install.sh"
      - "install-newsletter.sh"
      - "scripts/install.sh"
      - "scripts/install-mailcow-agent.sh"
      - "scripts/install-newsletter-agent.sh"
      - "scripts/install-newsletter-rspamd.sh"
      - "scripts/rspamd/moolias_newsletter.lua"
      - "compose.mailcow.yml"
      - "Dockerfile"
      - ".github/scripts/mailcow-feasibility.sh"
      - ".github/workflows/mailcow-integration.yml"

permissions:
  contents: read

jobs:
  real-mailcow:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - fresh
          - legacy-import
          - legacy-keep
    env:
      MAILCOW_DIR: /tmp/mailcow-dockerized
      REPORT_DIR: /tmp/mailcow-integration
      MAILCOW_HOSTNAME: mail.mailcow-ci.test
      MAILCOW_HTTP_PORT: "8080"
      MAILCOW_API_KEY: moolias-ci-integration
      MOOLIAS_AGENT_IMAGE: moolias:sender-agent-ci
      MOOLIAS_TEST_SCENARIO: ${{ matrix.scenario }}
      MAILCOW_READY_COMMAND: >-
        set -o pipefail;
        pytest -q integration_tests 2>&1
        | tee /tmp/mailcow-integration/ready-command.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Build local Moolias agent image
        run: docker build -t "$MOOLIAS_AGENT_IMAGE" .
      - name: Run Moolias against disposable Mailcow
        run: bash .github/scripts/mailcow-feasibility.sh
      - name: Upload Mailcow integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mailcow-integration-diagnostics-${{ matrix.scenario }}
          path: /tmp/mailcow-integration
          if-no-files-found: ignore
          retention-days: 7
