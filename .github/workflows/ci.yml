name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Generate service icon sprite for validation
        run: python -m moolias.service_icon_assets
      - run: ruff check .
      - run: pytest -q
      - run: node --check moolias/static/dialogs.js
      - run: node --check moolias/static/app.js
      - run: node --check moolias/static/stats.js
      - run: node --check moolias/static/sender-domain.js
      - run: node --check moolias/static/review.js
      - run: node --check moolias/static/review-behavior.js
      - run: node --check moolias/static/stats-mode.js
      - run: node --check moolias/static/sender-protection.js
      - run: node --check moolias/static/newsletters.js
      - run: node --check moolias/static/ui-icons-runtime.js
      - run: node --check moolias/static/pool-create-menu.js
      - run: node --check moolias/static/tour.js
      - run: bash -n install.sh
      - run: bash -n scripts/install.sh
      - run: bash -n scripts/install-mailcow-agent.sh
      - run: bash -n scripts/install-newsletter-agent.sh
      - run: bash -n update.sh
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          MAILCOW_DOCKER_NETWORK=mailcow-ci \
            docker compose -f compose.mailcow.yml config >/dev/null
      - name: Build Moolias image
        run: docker build -t moolias:test .

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Generate service icon sprite for browser tests
        run: python -m moolias.service_icon_assets
      - run: python -m playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: >-
          pytest -q browser_tests
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: test-results
          if-no-files-found: ignore