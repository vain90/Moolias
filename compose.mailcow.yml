# Recommended deployment when Moolias runs on the Mailcow host.
# The installer writes this file as /opt/moolias/compose.yml and discovers the
# existing Mailcow Docker network automatically.
services:
  moolias:
    image: ${MOOLIAS_IMAGE:-ghcr.io/vain90/moolias}:${MOOLIAS_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Keep the public URL from .env for browser-facing OAuth redirects while
      # server-side Mailcow requests stay on the private Docker network.
      MAILCOW_PUBLIC_URL: ${MAILCOW_URL}
      MAILCOW_URL: ${MAILCOW_INTERNAL_URL:-http://nginx-mailcow:8080}
    volumes:
      - moolias-data:/data
    networks:
      mailcow:
        aliases:
          - moolias-app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  moolias-data:

networks:
  mailcow:
    external: true
    name: ${MAILCOW_DOCKER_NETWORK:?MAILCOW_DOCKER_NETWORK is set by the Moolias installer}
